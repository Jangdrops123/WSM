services:
  app:
    image: nusapos-suite:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://nusa:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/nusapos
      HOST: 0.0.0.0
      API_PORT: "3001"
      TZ: Asia/Jakarta
    volumes:
      - uploads:/app/data/uploads
      - backups:/app/data/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: nusa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nusapos
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./pg-migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nusa -d nusapos"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  backups:
